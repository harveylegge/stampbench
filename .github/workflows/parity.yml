name: KoSIT parity

# Dual-runs the official KoSIT validator (legal reference for XRechnung) and
# @invoicegate/core over the official XRechnung test-suite, and publishes the
# delta report as an artifact + job summary. See tools/parity/README.md.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:17 UTC (odd minute to avoid the top-of-hour cron stampede).
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build @invoicegate/core
        run: npm run build -w @invoicegate/core

      - name: Download pinned KoSIT tooling (validator, config, test-suite)
        run: node tools/parity/download.mjs

      - name: Run parity comparison
        run: node tools/parity/run.mjs

      - name: Publish summary to job summary
        if: always()
        run: |
          if [ -f tools/parity/report/summary.md ]; then
            cat tools/parity/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.md produced — the run failed before reporting." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload parity report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: tools/parity/report/
          if-no-files-found: warn
          retention-days: 90
